version: '3.8'

services:
  silayi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silayi-master-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:3003"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-silayi_master}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
